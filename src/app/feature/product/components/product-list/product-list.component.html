<div class="container my-5">
  <h2 class="text-center mb-4">Nos Services</h2>

  <div class="row">
    @for (product of products$ | async; track product.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm border-0">
          <div class="text-center p-3"></div>
          <div class="card-body text-center">
            <h5 class="card-title fw-bold text-black">{{ product.name }}</h5>
            <p class="card-text text-muted">
              💰 Prix : <span class="fw-bold">{{ product.coeff }} €</span>
            </p>
            <section class="prestation container text-center my-5">
              <div class="row g-5 justify-content-center">
                <div class="col-12 col-md-12">
                  <div class="service-card-body">
                    <img [src]="serviceList[product.id % serviceList.length].imgUrl" alt="service" class="rounded-circle" />
                    <br />
                    <strong class="service-name">{{ serviceList[product.id % serviceList.length].nameService }}</strong>
                  </div>
                </div>
              </div>
            </section>
            <button type="button" class="btn btn-success" (click)="onSelectProduct(product)">Voir les détails</button>
            <!-- Bouton Ajouter -->
            <!-- <button class="btn btn-success mt-2" (click)="addToCart(provision)">
                Ajouter au panier
              </button> -->
          </div>
        </div>
      </div>
    }
  </div>
  <app-product *ngIf="selectedItem" [product]="selectedItem" (closeDetails)="CloseDetails()"></app-product>
</div>
