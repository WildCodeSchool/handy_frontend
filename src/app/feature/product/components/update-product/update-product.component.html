@if (isAdmin$ | async) {
  <div class="order-details-container">
    <h3>Modifier le produit</h3>
    <ul class="list-group">
      <li class="list-group-item">
        <h4>Nom :</h4>
        <input type="text" [(ngModel)]="product.name" class="form-control" />
      </li>
      <li class="list-group-item">
        <h4>Prix :</h4>
        <input type="number" [(ngModel)]="product.coeff" class="form-control" />
      </li>
    </ul>
    <div>
      <button type="button" class="btn btn-primary mt-2" (click)="updateProductDetails()">Mettre à jour</button>
      @if (successMessageUpdate) {
        <div class="alert alert-success mt-2" role="alert">
          {{ successMessageUpdate }}
        </div>
      }
    </div>
    <div></div>
  </div>
}
