<div class="orders-container p-6 bg-white rounded-2xl shadow-md max-w-5xl mx-auto mt-8">
  <h2 class="text-2xl font-semibold mb-6 text-gray-800 text-center">📦 Mes Commandes</h2>

  @if (orders.length > 0) {
    <div class="overflow-x-auto">
      <table class="min-w-full border border-gray-200 rounded-xl overflow-hidden">
        <thead class="bg-gray-100 text-left text-gray-600 text-sm uppercase tracking-wider">
          <tr>
            <th class="px-4 py-3">Numéro</th>
            <th class="px-4 py-3">Date</th>
            <th class="px-4 py-3">Statut</th>
            <th class="px-4 py-3">Utilisateur</th>
          </tr>
        </thead>
        <tbody class="text-gray-700">
          @for (order of orders; track order.orderNumber) {
            <tr class="border-t hover:bg-gray-50 transition">
              <td class="px-4 py-2 font-medium">{{ order.orderNumber }}</td>
              <td class="px-4 py-2">{{ order.dateOrder | date: 'dd/MM/yyyy' }}</td>
              <td class="px-4 py-2">
                <span
                  class="inline-block px-2 py-1 rounded-full text-xs font-semibold"
                  [ngClass]="{
                    'bg-yellow-100 text-yellow-700': order.statusLabel === 'En cours',
                    'bg-green-100 text-green-700': order.statusLabel === 'Validée',
                    'bg-red-100 text-red-700': order.statusLabel === 'Annulée',
                  }">
                  {{ order.statusLabel }}
                </span>
              </td>
              <td class="px-4 py-2">{{ order.userEmail }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  } @else {
    <p class="text-gray-500 text-center mt-4">Aucune commande disponible.</p>
  }
</div>
