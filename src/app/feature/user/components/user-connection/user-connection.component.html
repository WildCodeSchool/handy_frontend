<p>signup-form works!</p>
<div class="container d-flex">
  <div class="form-container text-center">
<form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="w-100 p-4 border rounded shadow-sm bg-light mt-5">
  <fieldset>
    <div class="mb-3">
      <label for="loginEmail" class="form-label">Email</label>
      <input id="loginEmail" formControlName="email" type="email" class="form-control" />
    </div>

    <div class="mb-3">
      <label for="loginPassword" class="form-label">Mot de passe</label>
      <input id="loginPassword" formControlName="password" type="password" class="form-control" />
    </div>

    <button type="submit" class="btn btn-success" [disabled]="loginForm.invalid">Se connecter</button>
  </fieldset>
  <div class="mt-3">
    <p class="mb-0">
      Pas de compte ?
      <a [routerLink]="'/signup'" class="link-primary">S'inscrire</a>

    </p>
  </div>
</form>
</div>
<div class="image-container">
  <img src="/assets/call.jpg" alt="Image" class="img-fluid" />
</div>
</div>
