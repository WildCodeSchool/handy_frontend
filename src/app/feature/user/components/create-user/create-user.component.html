<div class="mb-4 d-flex justify-content-center" id="selection-container">
  <h2>Je suis : </h2>
  <div>
  <button type="button" class="btn btn-outline-primary me-2" [class.active]="selectedRole === 'client'" (click)="selectRole('client')">Client</button>
  <button type="button" class="btn btn-outline-primary" [class.active]="selectedRole === 'provider'" (click)="selectRole('provider')">
    Prestataire
  </button>
</div>
</div>

<ng-container [ngSwitch]="selectedRole">
  <app-client-sign-up *ngSwitchCase="'client'"></app-client-sign-up>
  <app-provider-sign-up *ngSwitchCase="'provider'"></app-provider-sign-up>
</ng-container>
