<div class="profile-container" *ngIf="userProfile; else loadingOrError">
    <h2>Profil du fournisseur</h2>
  
    <form (ngSubmit)="updateProfile()">
      <div class="form-group">
        <label for="firstName">Prénom</label>
        <input id="firstName" [(ngModel)]="userProfile.firstName" name="firstName" required />
      </div>
  
      <div class="form-group">
        <label for="lastName">Nom</label>
        <input id="lastName" [(ngModel)]="userProfile.lastName" name="lastName" required />
      </div>
  
      <div class="form-group">
        <label for="address">Adresse</label>
        <input id="address" [(ngModel)]="userProfile.address" name="address" required />
      </div>
  
      <div class="form-group">
        <label for="city">Ville</label>
        <input id="city" [(ngModel)]="userProfile.city" name="city" required />
      </div>
  
      <button type="submit" [disabled]="isLoading">Mettre à jour le profil</button>
    </form>
  </div>
  
  <ng-template #loadingOrError>
    <div *ngIf="isLoading">Chargement...</div>
    <div *ngIf="error">{{ error }}</div>
  </ng-template>
