<div class="custom-toast-container">
  <div *ngFor="let toast of toastMessages; let i = index" class="toast-message">
    <span>{{ toast.message }}</span>
    <button type="button" (click)="removeToast(i)" class="close-btn">✖</button>
  </div>
</div>
<div class="container">
<full-calendar [options]="calendarOptions"></full-calendar>
</div>
