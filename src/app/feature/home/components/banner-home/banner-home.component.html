<div class="container-fluid bg-light text-dark py-5">
  <div class="row align-items-center">
    <div class="col-12 col-md-6 text-center text-md-start px-5">
      <h1 class="display-4 fw-bold mb-2">Besoin d'accompagnement</h1>
      <h1 class="display-4 text-success fw-bold mb-3">pour avancer avec confiance</h1>
      <p class="lead mb-4 text-muted">
        Chez HandyApp, nous comprenons que chaque parcours est unique. Que vous ayez besoin d’un soutien ponctuel ou d’un suivi régulier, nos
        prestataires qualifiés sont là pour vous guider à chaque étape.
      </p>
      <div class="d-flex flex-column flex-md-row justify-content-center justify-content-md-start align-items-stretch gap-2 mb-4">
        <input type="text" class="form-control w-100 w-md-75 rounded-pill px-4 py-3 fs-5" placeholder="Rechercher..." [(ngModel)]="keyword" />
        <button class="btn btn-dark rounded-pill ms-2 px-4 fs-5" type="button" (click)="onSearch()">🔍</button>
      </div>
      <div class="d-flex justify-content-center justify-content-md-start gap-3 mb-4 mb-md-0">
        <button type="button" class="btn btn-outline-success btn-lg" (click)="scrollToSection('about')">En savoir plus</button>
        <a routerLink="/order" class="btn btn-success btn-lg">Prendre rendez-vous</a>
      </div>
    </div>

    <div class="col-12 col-md-6 text-center overflow-hidden">
      <img src="assets/unsized3.jpg" alt="Image" class="img-fluid image-clipped" />
    </div>
  </div>
</div>
